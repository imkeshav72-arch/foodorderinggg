<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>FoodRush · Order Online</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#fff8f0;--surface:#ffffff;--primary:#ff5722;--primary-dark:#e64a19;--text:#1a1a2e;--muted:#888;--border:#f0e8e0;--radius:16px;--shadow:0 4px 24px rgba(255,87,34,0.10);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);}
/* NAV */
nav{background:var(--surface);border-bottom:1px solid var(--border);padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:64px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,0.06);}
.logo{font-size:1.5rem;font-weight:900;color:var(--primary);}
.logo span{color:var(--text);}
.cart-btn{background:var(--primary);color:#fff;border:none;border-radius:50px;padding:10px 22px;font-family:'Nunito',sans-serif;font-weight:800;font-size:0.9rem;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background 0.2s,transform 0.1s;}
.cart-btn:hover{background:var(--primary-dark);transform:translateY(-1px);}
.cart-count{background:#fff;color:var(--primary);border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:900;}
/* HERO */
.hero{background:linear-gradient(135deg,#ff5722 0%,#ff8a65 100%);color:#fff;padding:56px 32px;text-align:center;}
.hero h1{font-size:clamp(2rem,5vw,3rem);font-weight:900;margin-bottom:8px;}
.hero p{opacity:0.85;font-size:1.1rem;}
/* CATEGORIES */
.cats{display:flex;gap:10px;padding:24px 32px;overflow-x:auto;background:var(--surface);border-bottom:1px solid var(--border);}
.cats::-webkit-scrollbar{display:none;}
.cat-btn{background:transparent;border:2px solid var(--border);border-radius:50px;padding:8px 20px;font-family:'Nunito',sans-serif;font-weight:700;font-size:0.88rem;cursor:pointer;white-space:nowrap;transition:all 0.2s;color:var(--muted);}
.cat-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;}
/* MENU */
.main{max-width:1100px;margin:0 auto;padding:32px 20px;}
.section-title{font-size:1.4rem;font-weight:900;margin-bottom:20px;color:var(--text);}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;}
.item-card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;transition:transform 0.2s,box-shadow 0.2s;}
.item-card:hover{transform:translateY(-4px);box-shadow:var(--shadow);}
.item-emoji{background:linear-gradient(135deg,#fff3e0,#ffe0cc);text-align:center;font-size:3.5rem;padding:28px 0;}
.item-body{padding:16px;}
.item-name{font-weight:800;font-size:1rem;margin-bottom:4px;}
.item-desc{color:var(--muted);font-size:0.82rem;margin-bottom:10px;line-height:1.4;}
.item-footer{display:flex;align-items:center;justify-content:space-between;}
.item-price{font-weight:900;font-size:1.1rem;color:var(--primary);}
.item-rating{font-size:0.8rem;color:#f59e0b;font-weight:700;}
.add-btn{background:var(--primary);color:#fff;border:none;border-radius:50px;width:34px;height:34px;font-size:1.3rem;cursor:pointer;transition:background 0.2s,transform 0.1s;display:flex;align-items:center;justify-content:center;}
.add-btn:hover{background:var(--primary-dark);transform:scale(1.1);}
/* CART SIDEBAR */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:200;display:none;}
.cart-panel{position:fixed;right:0;top:0;bottom:0;width:380px;max-width:100%;background:var(--surface);z-index:201;box-shadow:-8px 0 40px rgba(0,0,0,0.15);display:flex;flex-direction:column;transform:translateX(100%);transition:transform 0.3s ease;}
.cart-panel.open{transform:translateX(0);}
.cart-header{padding:24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.cart-header h2{font-size:1.2rem;font-weight:900;}
.close-btn{background:var(--bg);border:none;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:1.2rem;}
.cart-items{flex:1;overflow-y:auto;padding:16px 24px;}
.cart-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.ci-emoji{font-size:2rem;width:44px;text-align:center;}
.ci-info{flex:1;}
.ci-name{font-weight:700;font-size:0.9rem;}
.ci-price{color:var(--primary);font-weight:800;font-size:0.88rem;}
.qty-ctrl{display:flex;align-items:center;gap:8px;}
.qty-btn{background:var(--bg);border:1px solid var(--border);border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:1rem;font-weight:700;display:flex;align-items:center;justify-content:center;}
.qty-num{font-weight:800;font-size:0.95rem;}
.cart-footer{padding:24px;border-top:1px solid var(--border);}
.cart-total{display:flex;justify-content:space-between;font-weight:900;font-size:1.1rem;margin-bottom:16px;}
.checkout-btn{width:100%;background:var(--primary);color:#fff;border:none;border-radius:12px;padding:16px;font-family:'Nunito',sans-serif;font-weight:900;font-size:1rem;cursor:pointer;transition:background 0.2s;}
.checkout-btn:hover{background:var(--primary-dark);}
.empty-cart{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-cart div{font-size:3rem;margin-bottom:12px;}
/* CHECKOUT MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:300;display:none;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--surface);border-radius:var(--radius);padding:32px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;}
.modal h2{font-weight:900;margin-bottom:24px;font-size:1.4rem;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-weight:700;font-size:0.85rem;margin-bottom:6px;color:var(--text);}
.form-group input,.form-group textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-family:'Nunito',sans-serif;font-size:0.95rem;outline:none;transition:border-color 0.2s;}
.form-group input:focus,.form-group textarea:focus{border-color:var(--primary);}
.modal-footer{display:flex;gap:12px;margin-top:24px;}
.btn-cancel{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px;font-family:'Nunito',sans-serif;font-weight:700;cursor:pointer;}
.btn-place{flex:2;background:var(--primary);color:#fff;border:none;border-radius:10px;padding:14px;font-family:'Nunito',sans-serif;font-weight:900;cursor:pointer;}
/* SUCCESS */
.success-box{text-align:center;padding:20px;}
.success-box .icon{font-size:4rem;margin-bottom:16px;}
.success-box h3{font-weight:900;font-size:1.4rem;color:#22c55e;margin-bottom:8px;}
.order-id{background:#f0fdf4;border:1px solid #86efac;border-radius:10px;padding:12px;margin:16px 0;font-weight:800;color:#15803d;}
@media(max-width:600px){.cart-panel{width:100%;}.hero{padding:36px 20px;}.cats{padding:16px;}}
</style>
</head>
<body>
<nav>
  <div class="logo">Food<span>Rush</span></div>
  <button class="cart-btn" onclick="toggleCart()">
    🛒 Cart <div class="cart-count" id="cartCount">0</div>
  </button>
</nav>

<div class="hero">
  <h1>🍕 Order Delicious Food</h1>
  <p>Fresh meals delivered to your door in 30–45 minutes</p>
</div>

<div class="cats" id="catBar"></div>

<div class="main">
  <div class="section-title" id="menuTitle">All Items</div>
  <div class="menu-grid" id="menuGrid"></div>
</div>

<!-- Cart -->
<div class="overlay" id="overlay" onclick="toggleCart()"></div>
<div class="cart-panel" id="cartPanel">
  <div class="cart-header">
    <h2>🛒 Your Cart</h2>
    <button class="close-btn" onclick="toggleCart()">✕</button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-footer" id="cartFooter" style="display:none">
    <div class="cart-total"><span>Total</span><span id="cartTotal">$0.00</span></div>
    <button class="checkout-btn" onclick="openCheckout()">Proceed to Checkout</button>
  </div>
</div>

<!-- Checkout Modal -->
<div class="modal-overlay" id="checkoutModal">
  <div class="modal">
    <div id="checkoutForm">
      <h2>📦 Checkout</h2>
      <div class="form-group"><label>Your Name</label><input id="cName" placeholder="John Doe"/></div>
      <div class="form-group"><label>Phone Number</label><input id="cPhone" placeholder="+1 234 567 8900"/></div>
      <div class="form-group"><label>Delivery Address</label><textarea id="cAddress" rows="3" placeholder="123 Main St, City, State…"></textarea></div>
      <div style="background:#fff8f0;border-radius:10px;padding:14px;margin-bottom:4px;font-weight:700;font-size:1rem;">
        Order Total: <span id="modalTotal" style="color:var(--primary)">$0.00</span>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" onclick="closeCheckout()">Cancel</button>
        <button class="btn-place" onclick="placeOrder()">Place Order 🎉</button>
      </div>
    </div>
    <div id="orderSuccess" style="display:none">
      <div class="success-box">
        <div class="icon">🎉</div>
        <h3>Order Placed!</h3>
        <p style="color:#666;margin-bottom:8px;">Your food is being prepared</p>
        <div class="order-id" id="orderIdBox"></div>
        <p style="color:#888;font-size:0.88rem;">Estimated delivery: 30–45 minutes</p>
        <button class="checkout-btn" style="margin-top:20px" onclick="closeCheckout();clearCart()">Back to Menu</button>
      </div>
    </div>
  </div>
</div>

<script>
const API = "http://localhost:5000/api";
let menu = [], cart = {}, currentCat = "All";

async function loadCategories(){
  try{
    const r = await fetch(`${API}/menu/categories`);
    const d = await r.json();
    const bar = document.getElementById("catBar");
    bar.innerHTML = d.data.map(c=>`<button class="cat-btn${c==="All"?" active":""}" onclick="filterCat('${c}')">${c}</button>`).join("");
  }catch{}
}

async function loadMenu(cat=""){
  try{
    const url = cat && cat!=="All" ? `${API}/menu?category=${cat}` : `${API}/menu`;
    const r = await fetch(url);
    const d = await r.json();
    menu = d.data;
    renderMenu();
  }catch{document.getElementById("menuGrid").innerHTML="<p style='color:#888'>Cannot connect to server. Make sure backend is running.</p>";}
}

function renderMenu(){
  document.getElementById("menuTitle").textContent = currentCat==="All" ? "All Items" : currentCat;
  document.getElementById("menuGrid").innerHTML = menu.map(item=>`
    <div class="item-card">
      <div class="item-emoji">${item.image_emoji}</div>
      <div class="item-body">
        <div class="item-name">${item.name}</div>
        <div class="item-desc">${item.description}</div>
        <div class="item-footer">
          <div>
            <div class="item-price">$${item.price.toFixed(2)}</div>
            <div class="item-rating">⭐ ${item.rating}</div>
          </div>
          <button class="add-btn" onclick="addToCart(${item.id})">+</button>
        </div>
      </div>
    </div>`).join("");
}

function filterCat(cat){
  currentCat = cat;
  document.querySelectorAll(".cat-btn").forEach(b=>b.classList.toggle("active",b.textContent===cat));
  loadMenu(cat);
}

function addToCart(id){
  cart[id] = (cart[id]||0)+1;
  updateCartUI();
}

function changeQty(id,delta){
  cart[id] = (cart[id]||0)+delta;
  if(cart[id]<=0) delete cart[id];
  updateCartUI();
}

function updateCartUI(){
  const total = Object.keys(cart).reduce((s,id)=>s+(cart[id]||0),0);
  document.getElementById("cartCount").textContent = total;

  const itemsEl = document.getElementById("cartItems");
  const footerEl = document.getElementById("cartFooter");

  if(!total){
    itemsEl.innerHTML=`<div class="empty-cart"><div>🛒</div><p>Your cart is empty</p></div>`;
    footerEl.style.display="none"; return;
  }

  let sum=0;
  itemsEl.innerHTML = Object.keys(cart).map(id=>{
    const item = menu.find(m=>m.id==id); if(!item) return "";
    const sub = item.price*cart[id]; sum+=sub;
    return `<div class="cart-item">
      <div class="ci-emoji">${item.image_emoji}</div>
      <div class="ci-info">
        <div class="ci-name">${item.name}</div>
        <div class="ci-price">$${sub.toFixed(2)}</div>
      </div>
      <div class="qty-ctrl">
        <button class="qty-btn" onclick="changeQty(${id},-1)">−</button>
        <span class="qty-num">${cart[id]}</span>
        <button class="qty-btn" onclick="changeQty(${id},1)">+</button>
      </div>
    </div>`;
  }).join("");

  document.getElementById("cartTotal").textContent=`$${sum.toFixed(2)}`;
  footerEl.style.display="block";
}

function toggleCart(){
  document.getElementById("cartPanel").classList.toggle("open");
  document.getElementById("overlay").style.display = document.getElementById("cartPanel").classList.contains("open") ? "block" : "none";
}

function openCheckout(){
  const sum = Object.keys(cart).reduce((s,id)=>{const item=menu.find(m=>m.id==id);return s+(item?item.price*cart[id]:0);},0);
  document.getElementById("modalTotal").textContent=`$${sum.toFixed(2)}`;
  document.getElementById("checkoutForm").style.display="block";
  document.getElementById("orderSuccess").style.display="none";
  document.getElementById("checkoutModal").style.display="flex";
  toggleCart();
}

function closeCheckout(){document.getElementById("checkoutModal").style.display="none";}

async function placeOrder(){
  const name=document.getElementById("cName").value.trim();
  const phone=document.getElementById("cPhone").value.trim();
  const address=document.getElementById("cAddress").value.trim();
  if(!name||!phone||!address){alert("Please fill all fields");return;}

  const items = Object.keys(cart).map(id=>({id:parseInt(id),qty:cart[id],name:menu.find(m=>m.id==id)?.name}));
  const total = items.reduce((s,i)=>{const item=menu.find(m=>m.id==i.id);return s+(item?item.price*i.qty:0);},0);

  try{
    const r = await fetch(`${API}/orders`,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({customer_name:name,customer_phone:phone,address,items,total:parseFloat(total.toFixed(2))})});
    const d = await r.json();
    if(d.success){
      document.getElementById("orderIdBox").textContent=`Order #${d.data.order_id} confirmed ✅`;
      document.getElementById("checkoutForm").style.display="none";
      document.getElementById("orderSuccess").style.display="block";
    }
  }catch{alert("Server error. Make sure backend is running.");}
}

function clearCart(){cart={};updateCartUI();}

loadCategories(); loadMenu();
</script>
</body>
</html>
